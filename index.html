<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Happy Birthday, Nyatigo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&family=Inter:wght@300;400;500&family=Manrope:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink: #f4ead9;
    --ink-dim: #cdbfae;
    --plum-1: #1b1220;
    --plum-2: #2a1a2b;
    --gold: #cda15e;
    --gold-bright: #e9c789;
    --rose: #d99a92;
    --line: rgba(205,161,94,0.28);
  }

  *{ margin:0; padding:0; box-sizing:border-box; }

  html, body{ height:100%; }

  body{
    font-family: 'Inter', sans-serif;
    color: var(--ink);
    background:
      radial-gradient(60% 50% at 50% 18%, rgba(205,161,94,0.10), transparent 60%),
      radial-gradient(80% 60% at 50% 100%, rgba(217,154,146,0.08), transparent 60%),
      linear-gradient(180deg, var(--plum-1), var(--plum-2));
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    position:relative;
    padding: 32px;
  }

  /* fine film-grain / vignette for depth, no cheap gradient look */
  body::before{
    content:"";
    position:fixed; inset:0;
    background: radial-gradient(120% 90% at 50% 50%, transparent 40%, rgba(0,0,0,0.55) 100%);
    pointer-events:none;
    z-index:1;
  }

  .stage{
    position:relative;
    z-index:2;
    display:flex;
    flex-direction:column;
    align-items:center;
    max-width: 480px;
    width:100%;
  }

  /* ---------- candle, the signature element ---------- */
  .candle-wrap{
    position:relative;
    height: 150px;
    display:flex;
    align-items:flex-end;
    justify-content:center;
    margin-bottom: 6px;
  }

  .flame-glow{
    position:absolute;
    top:-8px;
    width:120px; height:120px;
    background: radial-gradient(circle, rgba(233,199,137,0.35), transparent 65%);
    filter: blur(2px);
    opacity: 1;
    transition: opacity 0.9s ease;
    pointer-events:none;
  }

  .candle{
    width: 22px;
    height: 90px;
    background: linear-gradient(180deg, #f7f0e4, #e7dcc7);
    border-radius: 3px 3px 2px 2px;
    position:relative;
    box-shadow: inset -4px 0 6px rgba(0,0,0,0.12), 0 6px 18px rgba(0,0,0,0.35);
  }
  .candle::before{ /* wax drip */
    content:"";
    position:absolute;
    top:-2px; left:50%;
    width:26px; height:10px;
    transform: translateX(-50%);
    background: #efe6d4;
    border-radius: 50% 50% 40% 40%;
  }

  .wick{
    position:absolute;
    top:-16px; left:50%;
    width:2px; height:16px;
    background:#3a2e28;
    transform: translateX(-50%);
    border-radius: 1px;
    transition: height 0.5s ease, opacity 0.5s ease;
  }

  .flame{
    position:absolute;
    top:-46px; left:50%;
    width: 16px; height: 34px;
    transform: translateX(-50%);
    transform-origin: bottom center;
    animation: flicker 2.6s ease-in-out infinite;
  }
  .flame svg{ width:100%; height:100%; display:block; }

  @keyframes flicker{
    0%, 100% { transform: translateX(-50%) rotate(-2deg) scaleY(1); }
    25%      { transform: translateX(-50%) rotate(2deg) scaleY(1.04); }
    50%      { transform: translateX(-50%) rotate(-1deg) scaleY(0.97); }
    75%      { transform: translateX(-50%) rotate(3deg) scaleY(1.02); }
  }

  .candle-wrap.blown .flame{
    animation: none;
    transition: opacity 0.4s ease, transform 0.4s ease;
    opacity:0;
    transform: translateX(-50%) translateY(-14px) scale(0.4);
  }
  .candle-wrap.blown .wick{
    height: 3px;
    opacity: 0.6;
  }
  .candle-wrap.blown .flame-glow{ opacity:0; }

  .smoke{
    position:absolute;
    top:-46px; left:50%;
    width:3px; height:3px;
    border-radius:50%;
    background: rgba(220,210,200,0.55);
    opacity:0;
    pointer-events:none;
  }
  .candle-wrap.blown .smoke{
    animation: smoke-rise 1.6s ease-out forwards;
  }
  @keyframes smoke-rise{
    0%   { opacity:0.7; transform: translate(-50%,0) scale(1); }
    100% { opacity:0; transform: translate(-70%,-70px) scale(6); }
  }

  /* ---------- card ---------- */
  .card{
    text-align:center;
    padding: 46px 44px 40px;
    border: 1px solid var(--line);
    border-radius: 4px;
    background: linear-gradient(180deg, rgba(255,255,255,0.035), rgba(255,255,255,0.015));
    backdrop-filter: blur(6px);
    box-shadow: 0 30px 60px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.04);
    position:relative;
  }

  .eyebrow{
    font-family:'Manrope', -apple-system, BlinkMacSystemFont, sans-serif;
    font-weight: 600;
    font-size: 11px;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: var(--gold);
    opacity:0.85;
    margin-bottom: 18px;
  }

  h1{
    font-family:'Cormorant Garamond', serif;
    font-weight:500;
    font-size: clamp(2.4rem, 7vw, 3.4rem);
    line-height: 1.08;
    color: var(--ink);
    letter-spacing: 0.01em;
  }
  h1 em{
    font-style: italic;
    font-weight: 600;
    color: var(--gold-bright);
    display:block;
  }

  .rule{
    width: 56px;
    height: 1px;
    margin: 22px auto;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
  }

  .message{
    font-family:'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 1.28rem;
    color: var(--ink-dim);
    line-height:1.5;
    max-width: 340px;
    margin: 0 auto 30px;
  }
  .message .heart{ color: var(--rose); font-style:normal; }

  button{
    font-family:'Manrope', -apple-system, BlinkMacSystemFont, sans-serif;
    font-size: 13.5px;
    letter-spacing: 0.05em;
    color: var(--gold-bright);
    background: linear-gradient(180deg, rgba(255,255,255,0.14), rgba(255,255,255,0.04));
    border: 1px solid rgba(233,199,137,0.35);
    padding: 15px 36px;
    border-radius: 14px;
    cursor:pointer;
    font-weight:600;
    backdrop-filter: blur(14px) saturate(140%);
    -webkit-backdrop-filter: blur(14px) saturate(140%);
    transition: transform 0.35s cubic-bezier(.2,.7,.3,1), box-shadow 0.35s ease, background 0.35s ease, border-color 0.35s ease;
    box-shadow:
      0 8px 24px rgba(0,0,0,0.35),
      inset 0 1px 0 rgba(255,255,255,0.25),
      inset 0 -1px 0 rgba(0,0,0,0.15);
  }
  button:hover{
    transform: translateY(-2px);
    background: linear-gradient(180deg, rgba(255,255,255,0.20), rgba(255,255,255,0.06));
    border-color: rgba(233,199,137,0.55);
    box-shadow:
      0 12px 30px rgba(0,0,0,0.4),
      inset 0 1px 0 rgba(255,255,255,0.3),
      inset 0 -1px 0 rgba(0,0,0,0.15),
      0 0 24px rgba(205,161,94,0.18);
  }
  button:active{
    transform: translateY(0) scale(0.98);
  }

  .hint{
    margin-top:16px;
    font-size:11px;
    letter-spacing:0.08em;
    color: var(--ink-dim);
    opacity:0;
    transition: opacity 0.6s ease;
  }
  .hint.show{ opacity:0.55; }

  /* ---------- petals (elegant confetti replacement) ---------- */
  .petal{
    position:fixed;
    top:-24px;
    z-index:5;
    pointer-events:none;
    opacity:0.9;
    will-change: transform, opacity;
  }

  @media (max-width: 420px){
    .card{ padding: 38px 26px 34px; }
  }

  @media (prefers-reduced-motion: reduce){
    .flame, .candle-wrap.blown .flame, button, .rule{ animation: none !important; transition:none !important; }
  }
</style>
</head>
<body>

  <div class="stage">
    <div class="candle-wrap" id="candleWrap">
      <div class="flame-glow"></div>
      <div class="smoke"></div>
      <div class="candle">
        <div class="wick" id="wick"></div>
        <div class="flame" id="flame">
          <svg viewBox="0 0 16 34" xmlns="http://www.w3.org/2000/svg">
            <path d="M8 0 C 12 8, 16 13, 11 20 C 15 22, 13 30, 8 34 C 3 30, 1 22, 5 20 C 0 13, 4 8, 8 0 Z" fill="#f4a545"/>
            <path d="M8 8 C 10 13, 12 16, 9 20 C 11 21, 10 26, 8 29 C 6 26, 5 21, 7 20 C 4 16, 6 13, 8 8 Z" fill="#ffe9a8"/>
          </svg>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="eyebrow">A moment, just for you</div>
      <h1>Happy Birthday<em>Nyatigo</em></h1>
      <div class="rule"></div>
      <p class="message">What a beautiful and meaningful amount of <span class="heart">soul</span> one person can hold!</p>
      <button id="celebrateBtn">Make a Wish</button>
      <div class="hint" id="hint">It had to be you!</div>
    </div>
  </div>

<script>
  const btn = document.getElementById('celebrateBtn');
  const wrap = document.getElementById('candleWrap');
  const hint = document.getElementById('hint');
  let done = false;

  function petalBurst(){
    const colors = ['#cda15e', '#e9c789', '#d99a92', '#f4ead9'];
    const count = 46;
    for(let i=0;i<count;i++){
      const p = document.createElement('div');
      p.className = 'petal';
      const size = 5 + Math.random()*6;
      const isRound = Math.random() > 0.5;
      p.style.width = size + 'px';
      p.style.height = (isRound ? size : size*2.2) + 'px';
      p.style.background = colors[Math.floor(Math.random()*colors.length)];
      p.style.borderRadius = isRound ? '50%' : '2px';
      p.style.left = Math.random()*100 + 'vw';

      const duration = 3.2 + Math.random()*2.4;
      const delay = Math.random()*0.5;
      const drift = (Math.random()-0.5)*200;
      const spin = (Math.random()-0.5)*720;

      p.animate([
        { transform: `translate(0,0) rotate(0deg)`, opacity: 0 },
        { transform: `translate(${drift*0.2}px, 10vh) rotate(${spin*0.3}deg)`, opacity: 0.9, offset:0.15 },
        { transform: `translate(${drift}px, 105vh) rotate(${spin}deg)`, opacity: 0 }
      ], {
        duration: duration*1000,
        delay: delay*1000,
        easing: 'cubic-bezier(.3,.2,.4,1)',
        fill:'forwards'
      });

      document.body.appendChild(p);
      setTimeout(()=>p.remove(), (duration+delay)*1000 + 200);
    }
  }

  btn.addEventListener('click', () => {
    if(done){
      // relight small ambient moment on repeat click
      wrap.classList.remove('blown');
      done = false;
      hint.classList.remove('show');
      btn.textContent = 'Make a Wish';
      return;
    }
    wrap.classList.add('blown');
    petalBurst();
    hint.classList.add('show');
    btn.textContent = 'You Can Always Have More';
    done = true;
  });
</script>

</body>
</html>
