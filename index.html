<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Happy Birthday, Nyatigo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&family=Inter:wght@300;400;500&family=Manrope:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink: #f4ead9;
    --ink-dim: #cdbfae;
    --plum-1: #1b1220;
    --plum-2: #2a1a2b;
    --gold: #cda15e;
    --gold-bright: #e9c789;
    --rose: #d99a92;
    --line: rgba(205,161,94,0.28);
  }

  *{ margin:0; padding:0; box-sizing:border-box; }
  html, body{ height:100%; }

  body{
    font-family: 'Inter', sans-serif;
    color: var(--ink);
    background:
      radial-gradient(60% 50% at 50% 18%, rgba(205,161,94,0.10), transparent 60%),
      radial-gradient(80% 60% at 50% 100%, rgba(217,154,146,0.08), transparent 60%),
      linear-gradient(180deg, var(--plum-1), var(--plum-2));
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    position:relative;
    padding: 32px;
  }

  body::before{
    content:"";
    position:fixed; inset:0;
    background: radial-gradient(120% 90% at 50% 50%, transparent 40%, rgba(0,0,0,0.55) 100%);
    pointer-events:none;
    z-index:1;
  }

  .stage{
    position:relative;
    z-index:2;
    max-width: 480px;
    width:100%;
  }

  .scene{
    display:flex;
    flex-direction:column;
    align-items:center;
    transition: opacity 0.7s ease, transform 0.7s cubic-bezier(.2,.7,.3,1);
  }
  .scene[hidden]{ display:none; }
  .scene.leaving{
    opacity:0;
    transform: scale(0.94) translateY(-6px);
  }
  .scene.entering{
    opacity:0;
    transform: scale(1.04) translateY(6px);
  }
  .scene.entering.in{
    opacity:1;
    transform: scale(1) translateY(0);
  }

  /* ---------- single candle ---------- */
  .candle-wrap{
    position:relative;
    height: 150px;
    display:flex;
    align-items:flex-end;
    justify-content:center;
    margin-bottom: 6px;
  }

  .flame-glow{
    position:absolute;
    top:-8px;
    width:120px; height:120px;
    background: radial-gradient(circle, rgba(233,199,137,0.35), transparent 65%);
    filter: blur(2px);
    opacity: 1;
    transition: opacity 0.9s ease;
    pointer-events:none;
  }

  .candle{
    width: 22px;
    height: 90px;
    background: linear-gradient(180deg, #f7f0e4, #e7dcc7);
    border-radius: 3px 3px 2px 2px;
    position:relative;
    box-shadow: inset -4px 0 6px rgba(0,0,0,0.12), 0 6px 18px rgba(0,0,0,0.35);
  }
  .candle::before{
    content:"";
    position:absolute;
    top:-2px; left:50%;
    width:26px; height:10px;
    transform: translateX(-50%);
    background: #efe6d4;
    border-radius: 50% 50% 40% 40%;
  }

  .wick{
    position:absolute;
    top:-16px; left:50%;
    width:2px; height:16px;
    background:#3a2e28;
    transform: translateX(-50%);
    border-radius: 1px;
    transition: height 0.5s ease, opacity 0.5s ease;
  }

  .flame{
    position:absolute;
    top:-46px; left:50%;
    width: 16px; height: 34px;
    transform: translateX(-50%);
    transform-origin: bottom center;
    animation: flicker 2.6s ease-in-out infinite;
    cursor:pointer;
  }
  .flame svg{ width:100%; height:100%; display:block; pointer-events:none; }

  @keyframes flicker{
    0%, 100% { transform: translateX(-50%) rotate(-2deg) scaleY(1); }
    25%      { transform: translateX(-50%) rotate(2deg) scaleY(1.04); }
    50%      { transform: translateX(-50%) rotate(-1deg) scaleY(0.97); }
    75%      { transform: translateX(-50%) rotate(3deg) scaleY(1.02); }
  }

  .candle-wrap.stretching .flame{
    animation-play-state: paused;
    transition: transform 0.26s cubic-bezier(.2,.6,.3,1), filter 0.26s ease;
    transform: translateX(-50%) scaleX(2.4) scaleY(0.3) translateX(10px);
    filter: brightness(1.7) saturate(1.1);
  }
  .candle-wrap.stretching .flame-glow{
    transition: transform 0.26s ease, opacity 0.26s ease;
    transform: scaleX(1.7) scaleY(0.55);
    opacity: 1;
  }
  .candle-wrap.blown .flame{
    animation: none;
    transition: opacity 0.16s ease;
    opacity:0;
  }
  .candle-wrap.blown .wick{ height: 3px; opacity: 0.6; }
  .candle-wrap.blown .flame-glow{ opacity:0; transition: opacity 0.5s ease; }

  .ember{
    position:absolute;
    left:50%;
    border-radius:50%;
    background: radial-gradient(circle, #fff8e7, #e9c789 55%, transparent 78%);
    pointer-events:none;
    z-index:4;
  }

  /* ---------- cake scene ---------- */
  .cake-wrap{
    position:relative;
    height: 170px;
    display:flex;
    align-items:flex-end;
    justify-content:center;
    margin-bottom: -6px;
  }

  .cake{
    position:relative;
    width: 210px;
    height: 84px;
  }

  .tier{
    position:absolute;
    left:50%;
    transform: translateX(-50%);
    border-radius: 8px 8px 5px 5px;
    box-shadow: 0 22px 44px rgba(0,0,0,0.45), inset 0 2px 0 rgba(255,255,255,0.35);
  }
  .tier-bottom{
    bottom:0;
    width: 210px;
    height: 46px;
    background: linear-gradient(180deg, #f4ead9, #e2d1ab);
  }
  .tier-top{
    bottom: 40px;
    width: 150px;
    height: 40px;
    background: linear-gradient(180deg, #f7efe0, #e7d8bd);
  }
  .ribbon{
    position:absolute;
    left:50%;
    transform: translateX(-50%);
    bottom: 14px;
    width: 210px;
    height: 6px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
    opacity:0.7;
  }

  .mini-candle-wrap{
    position:absolute;
    bottom: 78px;
    display:flex;
    align-items:flex-end;
    justify-content:center;
    width: 40px;
  }
  .mini-candle-wrap.pos-0{ left: 27%; transform: translateX(-50%); }
  .mini-candle-wrap.pos-1{ left: 50%; transform: translateX(-50%); }
  .mini-candle-wrap.pos-2{ left: 73%; transform: translateX(-50%); }

  .mini-candle{
    width: 12px;
    height: 46px;
    background: linear-gradient(180deg, #f7f0e4, #e7dcc7);
    border-radius: 2px 2px 1px 1px;
    position:relative;
    box-shadow: inset -2px 0 4px rgba(0,0,0,0.12), 0 4px 10px rgba(0,0,0,0.3);
  }
  .mini-flame-glow{
    position:absolute;
    top:-6px; left:50%;
    transform: translateX(-50%);
    width:64px; height:64px;
    background: radial-gradient(circle, rgba(233,199,137,0.32), transparent 65%);
    filter: blur(2px);
    opacity: 1;
    transition: opacity 0.9s ease;
    pointer-events:none;
  }
  .mini-wick{
    position:absolute;
    top:-11px; left:50%;
    width:1.5px; height:11px;
    background:#3a2e28;
    transform: translateX(-50%);
    transition: height 0.5s ease, opacity 0.5s ease;
  }
  .mini-flame{
    position:absolute;
    top:-30px; left:50%;
    width: 11px; height: 24px;
    transform: translateX(-50%);
    transform-origin: bottom center;
    animation: flicker 2.3s ease-in-out infinite;
    cursor:pointer;
  }
  .mini-flame svg{ width:100%; height:100%; display:block; pointer-events:none; }
  .mini-candle-wrap.stretching .mini-flame{
    animation-play-state: paused;
    transition: transform 0.24s cubic-bezier(.2,.6,.3,1), filter 0.24s ease;
    transform: translateX(-50%) scaleX(2.3) scaleY(0.3) translateX(8px);
    filter: brightness(1.7) saturate(1.1);
  }
  .mini-candle-wrap.stretching .mini-flame-glow{
    transition: transform 0.24s ease, opacity 0.24s ease;
    transform: translateX(-50%) scaleX(1.6) scaleY(0.55);
    opacity: 1;
  }
  .mini-candle-wrap.blown .mini-flame{
    animation: none;
    transition: opacity 0.14s ease;
    opacity:0;
  }
  .mini-candle-wrap.blown .mini-wick{ height:2px; opacity:0.6; }
  .mini-candle-wrap.blown .mini-flame-glow{ opacity:0; transition: opacity 0.5s ease; }


  /* ---------- card ---------- */
  .card{
    text-align:center;
    padding: 46px 44px 40px;
    border: 1px solid var(--line);
    border-radius: 4px;
    background: linear-gradient(180deg, rgba(255,255,255,0.035), rgba(255,255,255,0.015));
    backdrop-filter: blur(6px);
    box-shadow: 0 30px 60px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.04);
    position:relative;
    width:100%;
  }

  .eyebrow{
    font-family:'Manrope', -apple-system, BlinkMacSystemFont, sans-serif;
    font-weight: 600;
    font-size: 11px;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: var(--gold);
    opacity:0.85;
    margin-bottom: 18px;
  }

  h1{
    font-family:'Cormorant Garamond', serif;
    font-weight:500;
    font-size: clamp(2.4rem, 7vw, 3.4rem);
    line-height: 1.08;
    color: var(--ink);
    letter-spacing: 0.01em;
  }
  h1 em{
    font-style: italic;
    font-weight: 600;
    color: var(--gold-bright);
    display:block;
  }

  .rule{
    width: 56px;
    height: 1px;
    margin: 22px auto;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
  }

  .message{
    font-family:'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 1.28rem;
    color: var(--ink-dim);
    line-height:1.5;
    max-width: 340px;
    margin: 0 auto 30px;
    transition: opacity 0.4s ease;
  }
  .message .heart{ color: var(--rose); font-style:normal; }

  button{
    font-family:'Manrope', -apple-system, BlinkMacSystemFont, sans-serif;
    font-size: 13.5px;
    letter-spacing: 0.05em;
    color: var(--gold-bright);
    background: linear-gradient(180deg, rgba(255,255,255,0.14), rgba(255,255,255,0.04));
    border: 1px solid rgba(233,199,137,0.35);
    padding: 15px 36px;
    border-radius: 14px;
    cursor:pointer;
    font-weight:600;
    backdrop-filter: blur(14px) saturate(140%);
    -webkit-backdrop-filter: blur(14px) saturate(140%);
    transition: transform 0.35s cubic-bezier(.2,.7,.3,1), box-shadow 0.35s ease, background 0.35s ease, border-color 0.35s ease, opacity 0.35s ease;
    box-shadow:
      0 8px 24px rgba(0,0,0,0.35),
      inset 0 1px 0 rgba(255,255,255,0.25),
      inset 0 -1px 0 rgba(0,0,0,0.15);
  }
  button:hover{
    transform: translateY(-2px);
    background: linear-gradient(180deg, rgba(255,255,255,0.20), rgba(255,255,255,0.06));
    border-color: rgba(233,199,137,0.55);
    box-shadow:
      0 12px 30px rgba(0,0,0,0.4),
      inset 0 1px 0 rgba(255,255,255,0.3),
      inset 0 -1px 0 rgba(0,0,0,0.15),
      0 0 24px rgba(205,161,94,0.18);
  }
  button:active{ transform: translateY(0) scale(0.98); }
  button[disabled]{
    opacity:0;
    pointer-events:none;
  }

  .card-bare{
    text-align:center;
    padding: 8px 20px 0;
    border:none;
    background:none;
    backdrop-filter:none;
    box-shadow:none;
  }

  .whisper{
    font-family:'Cormorant Garamond', serif;
    font-style: italic;
    font-weight: 500;
    font-size: clamp(1.4rem, 4.2vw, 1.8rem);
    letter-spacing: 0.03em;
    color: var(--gold-bright);
    opacity: 0.92;
  }
  .hint{
    margin-top:16px;
    font-family:'Cormorant Garamond', serif;
    font-style: italic;
    font-size:15px;
    letter-spacing:0.02em;
    color: var(--gold-bright);
    opacity:0;
    transition: opacity 0.6s ease;
  }
  .hint.show{ opacity:0.85; }

  .hint#cakeHint{
    font-family:'Manrope', -apple-system, BlinkMacSystemFont, sans-serif;
    font-style: normal;
    font-weight: 600;
    font-size: 11px;
    letter-spacing: 0.24em;
    text-transform: uppercase;
    color: var(--gold-bright);
    margin-top: 46px;
  }

  .sub-hint{
    font-family:'Manrope', -apple-system, BlinkMacSystemFont, sans-serif;
    font-size: 10.5px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink-dim);
    opacity: 0.5;
    margin-top: -14px;
    margin-bottom: 26px;
  }

  .tap-cue{
    font-family:'Manrope', -apple-system, BlinkMacSystemFont, sans-serif;
    font-size: 10.5px;
    font-weight: 600;
    letter-spacing: 0.26em;
    text-transform: uppercase;
    color: var(--gold);
    opacity: 0;
    margin-top: 14px;
    margin-bottom: 4px;
    transition: opacity 0.8s ease;
  }
  .tap-cue.show{
    animation: cue-breathe 2.6s ease-in-out infinite;
  }
  @keyframes cue-breathe{
    0%, 100% { opacity: 0.4; }
    50%      { opacity: 0.85; }
  }
  .petal{
    position:fixed;
    top:-24px;
    z-index:5;
    pointer-events:none;
    opacity:0.9;
    will-change: transform, opacity;
  }

  .wish-light{
    position:fixed;
    z-index:5;
    border-radius:50%;
    pointer-events:none;
    will-change: transform, opacity;
  }

  @media (max-width: 420px){
    .card{ padding: 38px 26px 34px; }
    .cake, .tier-bottom, .ribbon{ width: 180px; }
    .tier-top{ width: 128px; }
  }

  @media (prefers-reduced-motion: reduce){
    .flame, .mini-flame, .candle-wrap.blown .flame, .mini-candle-wrap.blown .mini-flame, .candle-wrap.stretching .flame, .mini-candle-wrap.stretching .mini-flame, button, .rule, .scene{ animation: none !important; transition:none !important; }
  }
</style>
</head>
<body>

  <div class="stage" id="stage">

    <!-- SCENE 1: single candle -->
    <div class="scene" id="sceneSingle">
      <div class="candle-wrap" id="candleWrap">
        <div class="flame-glow"></div>
        <div class="candle">
          <div class="wick" id="wick"></div>
          <div class="flame" id="flame">
            <svg viewBox="0 0 16 34" xmlns="http://www.w3.org/2000/svg">
              <defs>
                <radialGradient id="flameGradMain" cx="48%" cy="70%" r="72%">
                  <stop offset="0%" stop-color="#fff8e7"/>
                  <stop offset="34%" stop-color="#ffe19a"/>
                  <stop offset="70%" stop-color="#f2a53f"/>
                  <stop offset="100%" stop-color="#d97a2e"/>
                </radialGradient>
              </defs>
              <path d="M8 1 C 10.8 8 13.5 13 10.2 18.5 C 13.2 21 12.3 28 8 33 C 3.7 28 2.8 21 5.8 18.5 C 2.5 13 5.2 8 8 1 Z" fill="url(#flameGradMain)"/>
            </svg>
          </div>
        </div>
      </div>

      <div class="card">
        <div class="eyebrow">A moment, just for you</div>
        <h1>Happy Birthday<em>Nyatigo</em></h1>
        <div class="rule"></div>
        <p class="message">What a beautiful and meaningful amount of <span class="heart">soul</span> one person can hold!</p>
        <button id="celebrateBtn">Make a Wish</button>
      </div>
    </div>

    <!-- SCENE 2: cake with 3 candles -->
    <div class="scene" id="sceneCake" hidden>
      <div class="cake-wrap">
        <div class="cake">
          <div class="tier tier-top"></div>
          <div class="tier tier-bottom"></div>
          <div class="ribbon"></div>

          <div class="mini-candle-wrap pos-0" data-idx="0">
            <div class="mini-flame-glow"></div>
            <div class="mini-candle">
              <div class="mini-wick"></div>
              <div class="mini-flame">
                <svg viewBox="0 0 16 34" xmlns="http://www.w3.org/2000/svg">
                  <defs>
                    <radialGradient id="flameGradMini0" cx="48%" cy="70%" r="72%">
                      <stop offset="0%" stop-color="#fff8e7"/>
                      <stop offset="34%" stop-color="#ffe19a"/>
                      <stop offset="70%" stop-color="#f2a53f"/>
                      <stop offset="100%" stop-color="#d97a2e"/>
                    </radialGradient>
                  </defs>
                  <path d="M8 1 C 10.8 8 13.5 13 10.2 18.5 C 13.2 21 12.3 28 8 33 C 3.7 28 2.8 21 5.8 18.5 C 2.5 13 5.2 8 8 1 Z" fill="url(#flameGradMini0)"/>
                </svg>
              </div>
            </div>
          </div>

          <div class="mini-candle-wrap pos-1" data-idx="1">
            <div class="mini-flame-glow"></div>
            <div class="mini-candle">
              <div class="mini-wick"></div>
              <div class="mini-flame">
                <svg viewBox="0 0 16 34" xmlns="http://www.w3.org/2000/svg">
                  <defs>
                    <radialGradient id="flameGradMini1" cx="48%" cy="70%" r="72%">
                      <stop offset="0%" stop-color="#fff8e7"/>
                      <stop offset="34%" stop-color="#ffe19a"/>
                      <stop offset="70%" stop-color="#f2a53f"/>
                      <stop offset="100%" stop-color="#d97a2e"/>
                    </radialGradient>
                  </defs>
                  <path d="M8 1 C 10.8 8 13.5 13 10.2 18.5 C 13.2 21 12.3 28 8 33 C 3.7 28 2.8 21 5.8 18.5 C 2.5 13 5.2 8 8 1 Z" fill="url(#flameGradMini1)"/>
                </svg>
              </div>
            </div>
          </div>

          <div class="mini-candle-wrap pos-2" data-idx="2">
            <div class="mini-flame-glow"></div>
            <div class="mini-candle">
              <div class="mini-wick"></div>
              <div class="mini-flame">
                <svg viewBox="0 0 16 34" xmlns="http://www.w3.org/2000/svg">
                  <defs>
                    <radialGradient id="flameGradMini2" cx="48%" cy="70%" r="72%">
                      <stop offset="0%" stop-color="#fff8e7"/>
                      <stop offset="34%" stop-color="#ffe19a"/>
                      <stop offset="70%" stop-color="#f2a53f"/>
                      <stop offset="100%" stop-color="#d97a2e"/>
                    </radialGradient>
                  </defs>
                  <path d="M8 1 C 10.8 8 13.5 13 10.2 18.5 C 13.2 21 12.3 28 8 33 C 3.7 28 2.8 21 5.8 18.5 C 2.5 13 5.2 8 8 1 Z" fill="url(#flameGradMini2)"/>
                </svg>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="tap-cue" id="tapCue">touch a flame</div>

      <div class="card card-bare">
        <p class="whisper">and even more</p>
      </div>
      <div class="hint" id="cakeHint">It had to be you!</div>
    </div>

  </div>

<script>
  const sceneSingle = document.getElementById('sceneSingle');
  const sceneCake = document.getElementById('sceneCake');
  const wrap = document.getElementById('candleWrap');
  const btn = document.getElementById('celebrateBtn');
  const cakeHint = document.getElementById('cakeHint');
  const tapCue = document.getElementById('tapCue');
  let wishMade = false;

  function petalBurst(count){
    const colors = ['#cda15e', '#e9c789', '#d99a92', '#f4ead9'];
    for(let i=0;i<count;i++){
      const p = document.createElement('div');
      p.className = 'petal';
      const size = 5 + Math.random()*6;
      const isRound = Math.random() > 0.5;
      p.style.width = size + 'px';
      p.style.height = (isRound ? size : size*2.2) + 'px';
      p.style.background = colors[Math.floor(Math.random()*colors.length)];
      p.style.borderRadius = isRound ? '50%' : '2px';
      p.style.left = Math.random()*100 + 'vw';

      const duration = 3.2 + Math.random()*2.4;
      const delay = Math.random()*0.5;
      const drift = (Math.random()-0.5)*200;
      const spin = (Math.random()-0.5)*720;

      p.animate([
        { transform: `translate(0,0) rotate(0deg)`, opacity: 0 },
        { transform: `translate(${drift*0.2}px, 10vh) rotate(${spin*0.3}deg)`, opacity: 0.9, offset:0.15 },
        { transform: `translate(${drift}px, 105vh) rotate(${spin}deg)`, opacity: 0 }
      ], {
        duration: duration*1000,
        delay: delay*1000,
        easing: 'cubic-bezier(.3,.2,.4,1)',
        fill:'forwards'
      });

      document.body.appendChild(p);
      setTimeout(()=>p.remove(), (duration+delay)*1000 + 200);
    }
  }

  function spawnEmbers(wrapEl, originTop, scale){
    const count = 5 + Math.floor(Math.random()*3);
    for(let i=0;i<count;i++){
      const e = document.createElement('div');
      e.className = 'ember';
      const size = (1.6 + Math.random()*2.2) * scale;
      e.style.width = size + 'px';
      e.style.height = size + 'px';
      e.style.top = originTop + 'px';
      e.style.transform = 'translateX(-50%)';
      e.style.opacity = '0';
      wrapEl.appendChild(e);

      const dx = (16 + Math.random()*30) * scale;
      const dy = -(26 + Math.random()*36) * scale;
      const dur = 650 + Math.random()*450;
      const delay = Math.random()*90;

      e.animate([
        { transform: `translate(-50%,0) scale(1)`, opacity: 0.95 },
        { transform: `translate(calc(-50% + ${dx*0.55}px), ${dy*0.5}px) scale(0.85)`, opacity: 0.85, offset: 0.4 },
        { transform: `translate(calc(-50% + ${dx}px), ${dy}px) scale(0.15)`, opacity: 0 }
      ], {
        duration: dur,
        delay: delay,
        easing: 'cubic-bezier(.2,.6,.3,1)',
        fill: 'forwards'
      });

      setTimeout(() => e.remove(), dur + delay + 60);
    }
  }

  function risingLights(count){
    for(let i=0;i<count;i++){
      const l = document.createElement('div');
      l.className = 'wish-light';
      const size = 3 + Math.random()*5;
      const warmth = Math.random();
      const core = warmth > 0.5 ? '#fff3d6' : '#e9c789';
      l.style.width = size + 'px';
      l.style.height = size + 'px';
      l.style.background = `radial-gradient(circle, ${core}, rgba(233,199,137,0.5) 55%, transparent 75%)`;
      l.style.boxShadow = `0 0 ${size*2.4}px ${size*0.7}px rgba(233,199,137,0.35)`;

      const startX = Math.random()*100;
      const sway = (Math.random()-0.5)*70;
      const rise = 100 + Math.random()*20;
      const duration = 4 + Math.random()*3.5;
      const delay = Math.random()*1.4;

      l.style.left = startX + 'vw';
      l.style.top = '100vh';
      l.style.opacity = '0';

      document.body.appendChild(l);

      l.animate([
        { transform: `translate(0, 0)`, opacity: 0 },
        { transform: `translate(${sway*0.3}px, -${rise*0.25}vh)`, opacity: 0.9, offset: 0.18 },
        { transform: `translate(${sway*0.7}px, -${rise*0.7}vh)`, opacity: 0.75, offset: 0.65 },
        { transform: `translate(${sway}px, -${rise}vh)`, opacity: 0 }
      ], {
        duration: duration*1000,
        delay: delay*1000,
        easing: 'cubic-bezier(.25,.4,.3,1)',
        fill: 'forwards'
      });

      setTimeout(() => l.remove(), (duration+delay)*1000 + 200);
    }
  }

  // ---- Scene 1: single candle ----
  btn.addEventListener('click', () => {
    if(!wishMade){
      wrap.classList.add('stretching');
      setTimeout(() => {
        wrap.classList.remove('stretching');
        wrap.classList.add('blown');
        spawnEmbers(wrap, -40, 1.4);
      }, 260);
      risingLights(34);
      btn.textContent = 'You Can Always Have More';
      wishMade = true;
      return;
    }
    transitionToCake();
  });

  function transitionToCake(){
    btn.setAttribute('disabled','');
    sceneSingle.classList.add('leaving');
    setTimeout(() => {
      sceneSingle.setAttribute('hidden','');
      sceneCake.removeAttribute('hidden');
      sceneCake.classList.add('entering');
      requestAnimationFrame(() => {
        requestAnimationFrame(() => sceneCake.classList.add('in'));
      });
      setTimeout(() => tapCue.classList.add('show'), 900);
      risingLights(14);
    }, 650);
  }

  // ---- Scene 2: cake, 3 candles blown in one elegant left-to-right sweep ----
  const miniWraps = Array.from(document.querySelectorAll('.mini-candle-wrap'));
  const cakeEl = document.querySelector('.cake');
  let sweepStarted = false;

  function startSweep(){
    if(sweepStarted) return;
    sweepStarted = true;
    tapCue.classList.remove('show');
    tapCue.style.opacity = '0';
    miniWraps.forEach((w, i) => {
      const start = 160 + i * 240;
      setTimeout(() => w.classList.add('stretching'), start);
      setTimeout(() => {
        w.classList.remove('stretching');
        w.classList.add('blown');
        spawnEmbers(w, -26, 0.85);
      }, start + 240);
    });
    setTimeout(finale, 160 + miniWraps.length * 240 + 500);
  }

  miniWraps.forEach(w => {
    w.querySelector('.mini-flame').addEventListener('click', startSweep);
  });
  cakeEl.addEventListener('click', startSweep);
  cakeEl.style.cursor = 'pointer';

  function finale(){
    cakeHint.classList.add('show');
    petalBurst(70);
  }
</script>

</body>
</html>
